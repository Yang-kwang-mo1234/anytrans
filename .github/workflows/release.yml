name: Release

# Pushing a tag like v0.1.0 builds the installers and attaches them to a draft
# GitHub release. Nothing is signed with a developer certificate: Windows shows
# a SmartScreen warning, and macOS needs right-click > Open on first launch.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target aarch64-apple-darwin
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: AnyTrans ${{ github.ref_name }}
          releaseDraft: true
          args: ${{ matrix.args }}
      # The command line tool is not part of the Tauri bundle.
      - run: cargo build --release -p anytrans-cli
      - name: Attach the CLI
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/anytrans.exe anytrans-cli-windows-x64.exe
            gh release upload "${{ github.ref_name }}" anytrans-cli-windows-x64.exe --clobber
          else
            cp target/release/anytrans anytrans-cli-macos-arm64
            gh release upload "${{ github.ref_name }}" anytrans-cli-macos-arm64 --clobber
          fi
