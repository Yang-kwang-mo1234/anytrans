[package]
name = "anytrans-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "AnyTrans desktop and mobile app"

[lib]
name = "anytrans_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anytrans-core = { path = "../../crates/anytrans-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["sync"] }
# Not used directly. libc 0.2.190 made `in6_ifreq` and related items
# macOS-only, which stops netdev (a dependency of iroh) from compiling for
# iOS. Remove this once netdev builds against a newer libc.
libc = ">=0.2.150, <0.2.190"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
