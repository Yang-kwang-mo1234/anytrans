[package]
name = "anytrans-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Device pairing and resumable file transfer over iroh"

[dependencies]
iroh = "1.4"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
blake3 = "1"
anyhow = "1"
rand = "0.9"
data-encoding = "2"
tracing = "0.1"
iroh-mdns-address-lookup = "0.6.1"
gethostname = "1.1.0"

[dev-dependencies]
tempfile = "3"
